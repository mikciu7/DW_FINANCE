server {
    listen 80;

    # Główny katalog z plikami frontendu
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Obsługa frontendu (React/Vite) - SPA routing zapobiegający błędom 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Opcjonalne: cache dla statycznych assetów (przyspiesza ładowanie strony)
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3. Kierowanie ruchu do backendu (FastAPI)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
	proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
