server {
    listen 80;

    # 1. Tu obsługujemy Twój frontend (React/Vite)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # To zapobiega błędom 404, jeśli odświeżysz stronę
        try_files $uri $uri/ /index.html; 
    }

    # 2. Tu kierujemy ruch do Twojego backendu (FastAPI)
    location /api/ {
        # Zmienna "backend" to nazwa serwisu z Twojego pliku docker-compose.yml
        proxy_pass http://backend:8000/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}