services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_PORT=${DB_PORT:-5432}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Podczas lokalnego dev backend jest dostępny przez localhost
        # Na ECS zmień na URL ALB, np. https://api.twoja-domena.com/api
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
